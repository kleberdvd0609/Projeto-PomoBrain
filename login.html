<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PomoBrain - Acesso</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Cabeçalho da página -->
      <div class="cabecalho" role="banner">
        <h1 class="titulo-principal">🧠 PomoBrain</h1>
        <!-- Navegação apontando para os outros arquivos HTML -->
        <div class="navegacao" role="navigation" aria-label="Navegação principal">
            <ul class="lista-navegacao">
                <li class="item-navegacao"><a class="link-navegacao" href="index.html" aria-label="Navegação para a página de Timer">Timer</a></li>
                <li class="item-navegacao"><a class="link-navegacao" href="metodo.html" aria-label="Navegação para a página 'Como Funciona'">Como Funciona</a></li>
                <li class="item-navegacao"><a class="link-navegacao" href="faq.html" aria-label="Navegação para a página 'Vantagens & FAQ'">Vantagens & FAQ</a></li>
                <li class="item-navegacao"><a class="link-navegacao" href="login.html" aria-label="Página de Login">Login</a></li>
            </ul>
        </div>
    </div>

    <!-- Conteúdo principal -->
    <div class="pagina-principal" role="main">
        
        <!-- Seção de Login -->
        <div class="secao-login" id="secao-login" role="region" aria-labelledby="titulo-login">
            <h2 id="titulo-login">Entrar na sua conta</h2>
            
            <form class="formulario-login" action="index.html" method="get">
                <fieldset>
                    <legend>Dados de Acesso</legend>
                    
                    <div>
                        <label for="email-login">E-mail:</label>
                        <input type="email" id="email-login" required autocomplete="email">
                        
                    </div>
                    
                    <br>

                    <div>
                        <label for="senha-login">Senha:</label>
                        <input type="password" id="senha-login" required autocomplete="current-password">
                    </div>
                </fieldset>
                
                <br>
                <button type="submit">Entrar</button>
            </form>

        </div>

        <div class="divisor-conteudo" role="separator" aria-orientation="horizontal"></div>


        

    </div>

    <!-- Rodapé da página -->
    <div class="rodape" role="contentinfo">
        <p class="texto-rodape">&copy; 2026 PomoBrain.</p>
    </div>

</body>
</html>
