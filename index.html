<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PomoBrain - Timer</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/script.js" defer></script>
</head>

<body>

    <header class="cabecalho">
        <h1 class="titulo-principal"><a href="index.html">🧠 PomoBrain</a></h1>

        <nav>
            <ul class="lista-navegacao">
                <li><a class="link-navegacao" href="index.html">Timer</a></li>
                <li><a class="link-navegacao" href="pages/metodo.html">Como Funciona</a></li>
                <li><a class="link-navegacao" href="pages/faq.html">Vantagens & FAQ</a></li>
            </ul>
        </nav>
    </header>

    <main class="pagina-principal">
        <div class="timer-container">
            <h2 class="titulo-secao" id="mensagem-texto">Mais foco, menos ansiedade.</h2>

            <div>
                <button class="botao-modo ativo" type="button" id="btn-foco">Foco (25m)</button>
                <button class="botao-modo" type="button" id="btn-curta">Pausa (5m)</button>
                <button class="botao-modo" type="button" id="btn-longa">Pausa (15m)</button>
            </div>

            <div class="display-tempo" id="tempo-display">25:00</div>

            <div>
                <button class="botao-controle" type="button" id="btn-acao">Iniciar</button>
                <button class="botao-controle botao-reset" type="button" id="btn-reset">Resetar</button>
            </div>

            <p class="contador-texto" id="contador-texto">Pomodoros concluídos: 0</p>
        </div>

        <div class="secao-tarefas">
            <h3 class="titulo-secao">Seção de tarefas</h3>

            <form class="form-nova-tarefa" id="form-nova-tarefa">
                <input
                    class="input-tarefa"
                    id="input-nova-tarefa"
                    type="text"
                    placeholder="Adicione uma tarefa..."
                    aria-label="Nova tarefa"
                    maxlength="200"
                    required>
                <button class="botao-adicionar" type="submit" aria-label="Adicionar tarefa">+</button>
            </form>

            <ul class="lista-tarefas" id="lista-tarefas"></ul>
        </div>
    </main>

    <footer class="rodape">
        <p>&copy; 2026 PomoBrain.</p>
    </footer>
    <audio id="som-alarme" src="assets/audio/alarme.mp3" preload="auto"></audio>
</body>

</html>
