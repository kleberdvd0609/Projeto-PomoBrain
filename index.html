<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PomoBrain - Timer</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/script.js" defer></script>
</head>

<body>

    <!-- Cabeçalho -->
    <div class="cabecalho" id="bloco-cabecalho">
        <h1 class="titulo-principal">🧠 PomoBrain</h1>

        <div class="navegacao" id="bloco-navegacao">
            <ul class="lista-navegacao">
                <li class="item-navegacao"><a class="link-navegacao" href="index.html">Timer</a></li>
                <li class="item-navegacao"><a class="link-navegacao" href="pages/metodo.html">Como Funciona</a></li>
                <li class="item-navegacao"><a class="link-navegacao" href="pages/faq.html">Vantagens & FAQ</a></li>
                <li class="item-navegacao"><a class="link-navegacao" href="pages/login.html">Login</a></li>
            </ul>
        </div>
    </div>

    <!-- Conteúdo Principal -->
    <div class="pagina-principal" id="conteudo-principal">

        <!-- Bloco do Cronômetro -->
        <!-- Bloco do Cronômetro -->
        <div class="timer-container" id="bloco-timer">
            <h2 class="titulo-secao" id="mensagem-texto">Mais foco, menos ansiedade.</h2>

            <!-- Botões de Modos (Foco, Pausa Curta, Pausa Longa) -->
            <div class="grupo-botoes-modo" id="botoes-modo">
                <button class="botao-modo" type="button" id="btn-foco">Foco (25m)</button>
                <button class="botao-modo" type="button" id="btn-curta">Pausa (5m)</button>
                <button class="botao-modo" type="button" id="btn-longa">Pausa (15m)</button>
            </div>

            <!-- Display do Tempo -->
            <div class="display-tempo" id="tempo-display">25:00</div>

            <!-- Botão Único de Controle (Iniciar/Pausar) -->
            <div class="grupo-botoes-controle" id="botoes-controle">
                <button class="botao-controle" type="button" id="btn-acao">Iniciar</button>
            </div>

            <!-- Contador de Sessões -->
            <p class="contador-texto" id="contador-texto">Sessão 1</p>

        </div>

        <!-- Bloco de Tarefas -->
        <div class="secao-tarefas" id="bloco-tarefas">
            <h3 class="titulo-secao">Seção de tarefas</h3>

            <div class="container-lista">
                <ul class="lista-tarefas" id="lista-tarefas">

                    <!-- Os inputs foram agrupados para facilitar o CSS com Flexbox -->
                    <li class="item-tarefa" data-tarefa-id="1">
                        <input class="input-tarefa" type="text" placeholder="Digite sua tarefa aqui...">
                        <input class="checkbox-tarefa" type="checkbox" data-acao="concluir-tarefa">
                    </li>

                    <li class="item-tarefa" data-tarefa-id="2">
                        <input class="input-tarefa" type="text" placeholder="Digite sua tarefa aqui...">
                        <input class="checkbox-tarefa" type="checkbox" data-acao="concluir-tarefa">
                    </li>

                    <li class="item-tarefa" data-tarefa-id="3">
                        <input class="input-tarefa" type="text" placeholder="Digite sua tarefa aqui...">
                        <input class="checkbox-tarefa" type="checkbox" data-acao="concluir-tarefa">
                    </li>
                </ul>
            </div>
        </div>

    </div>

    <!-- Rodapé -->
    <div class="rodape" id="bloco-rodape">
        <p class="texto-rodape">&copy; 2026 PomoBrain.</p>
    </div>
    <!-- Áudio oculto para o alarme -->
    <audio id="som-alarme" src="assets/audio/alarme.mp3" preload="auto"></audio>
</body>

</html>
